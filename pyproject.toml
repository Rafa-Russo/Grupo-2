[project]
name = "grupo-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2.2",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ingest-crimes = "ingestion.crime:main"
ingest-listings = "ingestion.listings:main"
